name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Web/API image tag to publish
        required: true
        default: 1.8.1
      sync_latest:
        description: Also publish latest tags
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare Maven settings
        run: cp settings.example.xml settings.local.xml

      - name: Install vendored Maven artifacts
        run: |
          mvn -s settings.local.xml install:install-file \
            -DgroupId=com.riversoft \
            -DartifactId=ueditor \
            -Dversion=1.4.3 \
            -Dpackaging=war \
            -Dfile=vendor/maven/com/riversoft/ueditor/1.4.3/ueditor-1.4.3.war

      - name: Build and publish multi-arch images
        env:
          BPMT_IMAGE_TAG: ${{ inputs.image_tag }}
          BPMT_API_IMAGE_TAG: ${{ inputs.image_tag }}
          BPMT_SYNC_LATEST: ${{ inputs.sync_latest }}
        run: scripts/build-multiarch-images.sh
