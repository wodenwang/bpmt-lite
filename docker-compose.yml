services:
  bpmt-nginx:
    image: nginx:1.27-alpine
    container_name: bpmt-nginx
    depends_on:
      bpmt-web:
        condition: service_started
      bpmt-api:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${BPMT_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  bpmt-web:
    image: ghcr.io/wodenwang/bpmt-lite:${BPMT_IMAGE_TAG:-1.8.1}
    container_name: bpmt-web
    depends_on:
      bpmt-mariadb:
        condition: service_healthy
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_HOST: ${DB_HOST:-bpmt-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-bpmt}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      HIBERNATE_CACHE: "true"
      HAZELCAST_TCPIP: "true"
      HAZELCAST_TCPIP_MEMBERS: bpmt-web,bpmt-api
      HAZELCAST_GROUP_NAME: ${HAZELCAST_GROUP_NAME:-bpmt}
      HAZELCAST_GROUP_PASSWORD: ${BPMT_HAZELCAST_PASSWORD:-bpmt}
    volumes:
      - ./config/overrides:/config/overrides:ro
      - ./runtime/attachment:/usr/local/tomcat/webapps/attachment
      - ./runtime/download:/usr/local/tomcat/webapps/download
      - ./runtime/ueditor-upload:/usr/local/tomcat/webapps/ueditor/upload
      - ./runtime/platform-logs:/usr/local/tomcat/webapps/logs
      - ./runtime/tomcat-logs:/usr/local/tomcat/logs

  bpmt-api:
    image: ghcr.io/wodenwang/bpmt-lite-api:${BPMT_API_IMAGE_TAG:-1.8.1}
    container_name: bpmt-api
    depends_on:
      bpmt-mariadb:
        condition: service_healthy
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_HOST: ${DB_HOST:-bpmt-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-bpmt}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      BPMT_API_APP_KEY: ${BPMT_API_APP_KEY:-bpmt-api}
      BPMT_API_APP_SECRET: ${BPMT_API_APP_SECRET:-bpmt-api-secret}
      BPMT_API_ACT_AS: ${BPMT_API_ACT_AS:-admin}
      BPMT_API_DBOPS_EXECUTE_ENABLED: ${BPMT_API_DBOPS_EXECUTE_ENABLED:-true}
      HIBERNATE_CACHE: "true"
      HAZELCAST_TCPIP: "true"
      HAZELCAST_TCPIP_MEMBERS: bpmt-web,bpmt-api
      HAZELCAST_GROUP_NAME: ${HAZELCAST_GROUP_NAME:-bpmt}
      HAZELCAST_GROUP_PASSWORD: ${BPMT_HAZELCAST_PASSWORD:-bpmt}
    volumes:
      - ./config/overrides:/config/overrides:ro
      - ./runtime/api-platform-logs:/usr/local/tomcat/webapps/logs
      - ./runtime/api-tomcat-logs:/usr/local/tomcat/logs

  bpmt-mariadb:
    image: mariadb:10.11
    container_name: bpmt-mariadb
    restart: unless-stopped
    ports:
      - "${BPMT_DB_PORT:-3306}:3306"
    environment:
      TZ: Asia/Shanghai
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MARIADB_DATABASE: ${DB_NAME:-bpmt}
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/logs:/var/log/mysql
    entrypoint:
      - /bin/bash
      - -lc
      - |
        mkdir -p /var/log/mysql
        chown -R mysql:mysql /var/log/mysql
        exec docker-entrypoint.sh mariadbd \
          --character-set-server=utf8 \
          --collation-server=utf8_general_ci \
          --lower_case_table_names=1 \
          --max-allowed-packet=1G \
          --net-read-timeout=600 \
          --net-write-timeout=600 \
          --log-error=/var/log/mysql/mariadb.err \
          --slow-query-log=1 \
          --slow-query-log-file=/var/log/mysql/mariadb-slow.log
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
