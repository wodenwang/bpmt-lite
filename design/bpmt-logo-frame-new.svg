<svg xmlns="http://www.w3.org/2000/svg" width="150" height="87" viewBox="0 0 150 87" role="img" aria-labelledby="title desc">
  <title id="title">BPMT logo centered</title>
  <desc id="desc">A centered BPMT lockup for the frame_new layout.</desc>
  <defs>
    <linearGradient id="markGradient" x1="13" y1="25" x2="50" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <g fill="none" fill-rule="evenodd">
    <g transform="translate(14 27)">
      <rect x="0" y="0" width="33" height="6" rx="3" fill="url(#markGradient)"/>
      <rect x="0" y="11" width="26" height="6" rx="3" fill="#155e75"/>
      <rect x="0" y="22" width="33" height="6" rx="3" fill="#0f766e"/>
      <circle cx="36" cy="3" r="3" fill="#93c5fd"/>
      <circle cx="29" cy="14" r="3" fill="#67e8f9"/>
      <circle cx="36" cy="25" r="3" fill="#99f6e4"/>
    </g>
    <text x="62" y="53" fill="#102033" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="0.8">BPMT</text>
  </g>
</svg>
